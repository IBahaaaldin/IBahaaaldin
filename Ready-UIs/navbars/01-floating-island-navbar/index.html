  <style>
    /* Smooth global theme transition */
    html, body {
      transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dark Mode Glass - Apple / macOS Dock Craft */
    .dark .glass-dock {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.75),
                  0 0 0 1px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
    }

    /* Light Mode Glass - Ultra-clean Porcelain */
    .glass-dock {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08),
                  0 0 0 1px rgba(0, 0, 0, 0.04),
                  inset 0 1px 0 0 rgba(255, 255, 255, 1);
    }

    /* Sliding pill indicator */
    #navIndicator {
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.26s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.2s ease;
    }

    /* Micro-interactions */
    .tab-btn {
      position: relative;
      transition: color 0.2s ease, transform 0.15s ease;
    }
    .tab-btn:active {
      transform: scale(0.96);
    }

    /* Rotating theme toggle */
    .theme-icon {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    /* Mobile drawer smooth animation */
    #mobileDropdown {
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

  <!-- INTERACTIONS JAVASCRIPT -->
  <!-- ======================================================== -->
  <script>
    // 1. Sliding Magnetic Indicator (Desktop)
    const navContainer = document.getElementById('navContainer');
    const indicator = document.getElementById('navIndicator');
    const tabs = navContainer ? navContainer.querySelectorAll('.tab-btn') : [];

    tabs.forEach(tab => {
      tab.addEventListener('mouseenter', () => {
        const rect = tab.getBoundingClientRect();
        const parentRect = navContainer.getBoundingClientRect();
        indicator.style.opacity = '1';
        indicator.style.width = `${rect.width}px`;
        indicator.style.transform = `translateX(${rect.left - parentRect.left}px)`;
      });

      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('font-semibold', 'text-neutral-950', 'dark:text-white'));
        tab.classList.add('font-semibold', 'text-neutral-950', 'dark:text-white');
      });
    });

    if (navContainer) {
      navContainer.addEventListener('mouseleave', () => {
        indicator.style.opacity = '0';
      });
    }

    // 2. Dark / White Mode Switcher
    const html = document.documentElement;
    const body = document.body;
    const themeBtn = document.getElementById('themeToggleBtn');

    themeBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      body.style.backgroundColor = isDark ? '#000000' : '#ffffff';

      themeBtn.style.transform = 'rotate(180deg)';
      setTimeout(() => {
        themeBtn.style.transform = 'none';
      }, 300);
    });

    // 3. Real Responsive Mobile Menu
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const mobileDropdown = document.getElementById('mobileDropdown');
    const mobileBackdrop = document.getElementById('mobileBackdrop');
    const lineTop = document.getElementById('lineTop');
    const lineMid = document.getElementById('lineMid');
    const lineBot = document.getElementById('lineBot');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    function openMobileMenu() {
      mobileDropdown.classList.remove('hidden');
      mobileDropdown.classList.add('flex');
      mobileBackdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        mobileDropdown.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
        mobileDropdown.classList.add('opacity-100', 'translate-y-0');
        mobileBackdrop.classList.remove('opacity-0');
        mobileBackdrop.classList.add('opacity-100');
      });
      // Morph hamburger to X
      if (lineTop && lineMid && lineBot) {
        lineTop.setAttribute('transform', 'rotate(45 12 12) translate(0, 5)');
        lineMid.style.opacity = '0';
        lineBot.setAttribute('transform', 'rotate(-45 12 12) translate(0, -5)');
      }
    }

    function closeMobileMenu() {
      mobileDropdown.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
      mobileDropdown.classList.remove('opacity-100', 'translate-y-0');
      mobileBackdrop.classList.remove('opacity-100');
      mobileBackdrop.classList.add('opacity-0');
      setTimeout(() => {
        mobileDropdown.classList.add('hidden');
        mobileDropdown.classList.remove('flex');
        mobileBackdrop.classList.add('hidden');
      }, 250);
      // Morph X back to hamburger
      if (lineTop && lineMid && lineBot) {
        lineTop.removeAttribute('transform');
        lineMid.style.opacity = '1';
        lineBot.removeAttribute('transform');
      }
    }

    if (mobileBtn && mobileDropdown) {
      mobileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !mobileDropdown.classList.contains('hidden') && !mobileDropdown.classList.contains('pointer-events-none');
        if (isOpen) {
          closeMobileMenu();
        } else {
          openMobileMenu();
        }
      });
    }

    if (mobileBackdrop) {
      mobileBackdrop.addEventListener('click', closeMobileMenu);
    }

    mobileLinks.forEach(link => {
      link.addEventListener('click', closeMobileMenu);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeMobileMenu();
      }
    });
  </script>
