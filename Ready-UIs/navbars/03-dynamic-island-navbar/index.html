<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Island Navbar — Ready-UIs</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    /* Smooth global theme transition */
    html, body {
      transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Apple Dynamic Island - Pure Fluid Surface */
    .dark .dynamic-island {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9),
                  0 0 0 1px rgba(255, 255, 255, 0.05),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
    }
    .dynamic-island {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12),
                  0 0 0 1px rgba(0, 0, 0, 0.04),
                  inset 0 1px 0 0 rgba(255, 255, 255, 1);
    }

    /* Apple spring physics for the island expansion */
    .island-spring {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.15);
    }

    /* Animated equalizer waveform bars */
    @keyframes barWave {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    .eq-bar-1 { animation: barWave 0.8s ease-in-out infinite 0.1s; }
    .eq-bar-2 { animation: barWave 0.8s ease-in-out infinite 0.35s; }
    .eq-bar-3 { animation: barWave 0.8s ease-in-out infinite 0.2s; }
    .eq-bar-4 { animation: barWave 0.8s ease-in-out infinite 0.45s; }

    /* Pill hover indicator */
    .nav-pill-btn {
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-pill-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }
    html:not(.dark) .nav-pill-btn:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    /* Prevent text wrapping across entire navbar */
    .no-wrap {
      white-space: nowrap;
    }
  </style>
</head>
<body class="bg-[#000000] dark:bg-[#000000] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-neutral-800 selection:text-white relative">

  <!-- ======================================================== -->
  <!-- MOBILE BACKDROP OVERLAY -->
  <!-- ======================================================== -->
  <div id="islandBackdrop" class="fixed inset-0 bg-black/60 dark:bg-black/80 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

  <!-- ======================================================== -->
  <!-- DYNAMIC ISLAND NAVBAR (DEAD CENTER, EXPANDABLE APPLE PILL) -->
  <!-- ======================================================== -->
  <header class="relative z-50 flex flex-col items-center w-full max-w-sm sm:max-w-none mx-auto">
    
    <div id="islandContainer" 
         class="dynamic-island island-spring rounded-[28px] p-2 sm:px-3 sm:py-2 flex flex-col overflow-hidden w-full sm:w-auto">
      
      <!-- Top Row: Compact Dynamic Island Bar -->
      <div class="flex items-center justify-between gap-2 w-full sm:w-auto">
        
        <!-- Left: Monogram + Status Pulse -->
        <a href="#home" class="flex items-center gap-2.5 pl-1 pr-2 py-0.5 rounded-full group focus:outline-none flex-shrink-0">
          <div class="relative w-8 h-8 rounded-full bg-neutral-900 dark:bg-neutral-800 border border-neutral-700/80 flex items-center justify-center text-xs font-semibold text-white group-hover:scale-105 transition-transform flex-shrink-0">
            <span>BA</span>
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-black dark:ring-black animate-pulse"></span>
          </div>
          <div class="flex flex-col text-left leading-tight no-wrap">
            <span class="text-xs font-semibold text-neutral-900 dark:text-white tracking-tight whitespace-nowrap no-wrap">Bahaa Aldin</span>
            <span class="text-[10px] text-emerald-500 font-medium flex items-center gap-1 whitespace-nowrap no-wrap">
              <span class="whitespace-nowrap no-wrap">Available for Work</span>
            </span>
          </div>
        </a>

        <!-- Desktop Navigation Items (Hidden on Mobile) -->
        <nav class="hidden md:flex items-center gap-1">
          <a href="#work" class="nav-pill-btn px-3 py-1.5 rounded-full text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white whitespace-nowrap no-wrap">
            Work
          </a>
          <a href="#projects" class="nav-pill-btn px-3 py-1.5 rounded-full text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white whitespace-nowrap no-wrap">
            Projects
          </a>
          <a href="#about" class="nav-pill-btn px-3 py-1.5 rounded-full text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white whitespace-nowrap no-wrap">
            About
          </a>
          <a href="#writing" class="nav-pill-btn px-3 py-1.5 rounded-full text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white whitespace-nowrap no-wrap">
            Writing
          </a>
        </nav>

        <!-- Right Side: Waveform / Expand Pill + Theme Toggle -->
        <div class="flex items-center gap-1.5 flex-shrink-0">
          
          <!-- Dynamic Expand Trigger Chip (Mini Activity Ticker) -->
          <button id="islandToggleBtn" 
                  type="button"

            <!-- Animated Sound Waveform -->
            <div class="flex items-end gap-[2px] h-3.5 px-0.5 flex-shrink-0">
              <span class="w-[2.5px] bg-emerald-500 rounded-full eq-bar-1"></span>
              <span class="w-[2.5px] bg-emerald-500 rounded-full eq-bar-2"></span>
              <span class="w-[2.5px] bg-emerald-500 rounded-full eq-bar-3"></span>

          </button>

          <!-- Theme Switcher Button -->

                  aria-label="Toggle Color Theme"

            <!-- Sun (Dark mode) -->
            <svg id="sunIcon" class="w-4 h-4 fill-none stroke-current stroke-2 hidden dark:block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <!-- Moon (Light mode) -->

          </button>

          <!-- Desktop Contact CTA -->
          <a href="mailto:bahaam.coding@gmail.com" 
             class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-neutral-900 dark:text-white bg-neutral-200 dark:bg-neutral-800 hover:bg-neutral-300 dark:hover:bg-neutral-700 active:scale-95 transition-all whitespace-nowrap no-wrap flex-shrink-0">

          </a>
        </div>
      </div>

      <!-- ======================================================== -->
      <!-- EXPANDED DYNAMIC ISLAND CONTENT (MORPHS SMOOTHLY OPEN) -->
      <!-- ======================================================== -->
      <div id="islandExpandedArea" class="hidden flex-col gap-3 pt-3.5 mt-2.5 border-t border-neutral-200 dark:border-neutral-800/80 w-full transition-all duration-300">
        
        <!-- Live Activity Card -->
        <div class="flex items-center justify-between p-3 rounded-2xl bg-neutral-100 dark:bg-neutral-900/90 border border-neutral-200 dark:border-white/5">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white text-base font-bold shadow-md shadow-cyan-500/20">
              ⚡
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-neutral-900 dark:text-white">Air Canvas System</span>
                <span class="text-[9px] px-1.5 py-0.5 rounded bg-cyan-500/10 text-cyan-500 dark:text-cyan-400 font-mono">In Progress</span>
              </div>
              <div class="text-[11px] text-neutral-500 dark:text-neutral-400">OpenCV real-time hand gesture tracking engine</div>
            </div>
          </div>

          <a href="https://github.com/IBahaaaldin" target="_blank" class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-neutral-800 text-xs font-medium text-neutral-900 dark:text-white hover:scale-105 transition-transform flex items-center gap-1 border border-neutral-200 dark:border-neutral-700">
            <span>Repo</span>
            <svg class="w-3 h-3 stroke-current stroke-2 fill-none" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
          </a>
        </div>

        <!-- Mobile Navigation Rows (Visible when expanded on small screens) -->
        <div class="flex md:hidden flex-col gap-1 border-t border-neutral-200 dark:border-neutral-800/80 pt-2.5">
          <a href="#work" class="flex items-center justify-between p-2 rounded-xl text-xs font-medium text-neutral-800 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-white/[0.08]">
            <span>Featured Work</span>
            <svg class="w-3.5 h-3.5 text-neutral-400 stroke-current stroke-2 fill-none" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </a>
          <a href="#projects" class="flex items-center justify-between p-2 rounded-xl text-xs font-medium text-neutral-800 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-white/[0.08]">
            <span>All Projects &amp; Open Source</span>
            <svg class="w-3.5 h-3.5 text-neutral-400 stroke-current stroke-2 fill-none" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </a>
          <a href="#about" class="flex items-center justify-between p-2 rounded-xl text-xs font-medium text-neutral-800 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-white/[0.08]">
            <span>About Developer</span>
            <svg class="w-3.5 h-3.5 text-neutral-400 stroke-current stroke-2 fill-none" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        </div>

        <!-- Expanded Footer: Socials & Fast CTA -->
        <div class="flex items-center justify-between pt-2 border-t border-neutral-200 dark:border-neutral-800/80">
          <div class="flex items-center gap-1.5">
            <a href="https://github.com/IBahaaaldin" target="_blank" aria-label="GitHub" class="p-2 rounded-xl text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white hover:bg-neutral-100 dark:hover:bg-white/[0.08]">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
            </a>
            <a href="https://www.linkedin.com/in/bahaa-mohammed-371259369" target="_blank" aria-label="LinkedIn" class="p-2 rounded-xl text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white hover:bg-neutral-100 dark:hover:bg-white/[0.08]">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.64 1.64 0 1 0 0-3.28 1.64 1.64 0 0 0 0 3.28m1.4 10.74v-8.37H5.06v8.37h2.8z"/></svg>
            </a>
            <a href="https://www.instagram.com/ibahaaaldincoding" target="_blank" aria-label="Instagram" class="p-2 rounded-xl text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white hover:bg-neutral-100 dark:hover:bg-white/[0.08]">
              <svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
            </a>
          </div>

          <a href="mailto:bahaam.coding@gmail.com" class="px-4 py-2 rounded-xl text-xs font-semibold text-neutral-900 dark:text-black bg-white dark:bg-white hover:bg-neutral-100 transition-all shadow-md flex items-center gap-1.5 whitespace-nowrap no-wrap flex-shrink-0">
            <span class="whitespace-nowrap no-wrap">Get in Touch</span>
            <svg class="w-3.5 h-3.5 stroke-current stroke-2 fill-none flex-shrink-0" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      </div>

    </div>
  </header>

  <!-- ======================================================== -->
  <!-- INTERACTIONS JAVASCRIPT -->
  <!-- ======================================================== -->
  <script>
    const islandContainer = document.getElementById('islandContainer');
    const islandToggleBtn = document.getElementById('islandToggleBtn');
    const islandExpandedArea = document.getElementById('islandExpandedArea');
    const islandChevron = document.getElementById('islandChevron');
    const islandBackdrop = document.getElementById('islandBackdrop');
    const themeBtn = document.getElementById('themeToggleBtn');
    const html = document.documentElement;
    const body = document.body;

    let isExpanded = false;

    function expandIsland() {
      islandExpandedArea.classList.remove('hidden');
      islandExpandedArea.classList.add('flex');
      islandChevron.classList.add('rotate-180');
      islandContainer.classList.add('rounded-[32px]');
      islandContainer.classList.remove('rounded-[28px]');
      islandBackdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        islandBackdrop.classList.remove('opacity-0');
        islandBackdrop.classList.add('opacity-100');
      });
      isExpanded = true;
    }

    function collapseIsland() {
      islandExpandedArea.classList.add('hidden');
      islandExpandedArea.classList.remove('flex');
      islandChevron.classList.remove('rotate-180');
      islandContainer.classList.remove('rounded-[32px]');
      islandContainer.classList.add('rounded-[28px]');
      islandBackdrop.classList.remove('opacity-100');
      islandBackdrop.classList.add('opacity-0');
      setTimeout(() => {
        islandBackdrop.classList.add('hidden');
      }, 250);
      isExpanded = false;
    }

    function toggleIsland() {
      if (isExpanded) {
        collapseIsland();
      } else {
        expandIsland();
      }
    }

    islandToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleIsland();
    });

    islandBackdrop.addEventListener('click', collapseIsland);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isExpanded) {
        collapseIsland();
      }
    });

    // Theme Switcher
    themeBtn.addEventListener('click', () => {
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      body.style.backgroundColor = isDark ? '#000000' : '#ffffff';

      themeBtn.style.transform = 'rotate(180deg)';
      setTimeout(() => {
        themeBtn.style.transform = 'none';
      }, 300);
    });
  </script>
</body>
</html>
